name: Sync upstream content (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync-upstream-content
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'Luo-root/AI-Infra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Luo-root/AI-Infra
      PLAYWRIGHT_CHANNEL: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch upstream source history (data only)
        run: git fetch --no-tags https://github.com/pacoxu/AI-Infra.git main:refs/remotes/upstream/main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Read fixed upstream main (never run upstream code)
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          git -c core.hooksPath=/dev/null clone --no-checkout --depth 1 --single-branch --branch main https://github.com/pacoxu/AI-Infra.git "$RUNNER_TEMP/upstream"
          sha=$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "branch=sync/upstream-content-$sha" >> "$GITHUB_OUTPUT"
      - name: Check duplicate PRs and never overwrite existing branches
        id: duplicate
        env:
          BRANCH: ${{ steps.upstream.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          count=$(gh pr list --state all --head "$BRANCH" --base main --json number --jq 'length')
          if [ "$count" != 0 ]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'A PR for this upstream commit already exists (open, closed, or merged). No branch or PR was changed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            if [ -n "$(git ls-remote --heads origin "$BRANCH")" ]; then
              echo '::error::Branch already exists without a matching PR. Refusing to overwrite it; review it manually.'
              exit 1
            fi
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.duplicate.outputs.exists == 'false'
        with:
          bun-version: '1.3.14'
      - name: Synchronize, validate fully, and report stale candidates
        if: steps.duplicate.outputs.exists == 'false'
        id: sync
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python learning/scripts/sync-upstream.py --source "$RUNNER_TEMP/upstream" --root "$GITHUB_WORKSPACE" --commit "$UPSTREAM_SHA" > "$RUNNER_TEMP/sync-summary.md"
          cat "$RUNNER_TEMP/sync-summary.md" >> "$GITHUB_STEP_SUMMARY"
          # GITHUB_TOKEN-created PRs do not trigger ordinary CI: validate here.
          python learning/scripts/build-library.py
          python -m unittest discover -s learning/tests -p 'test_*.py' -v
          (
            cd learning
            bun install --frozen-lockfile
            bun run build
            bunx playwright install --with-deps chromium
            bun run test
          )
          # Only managed content can enter this PR; never stage project READMEs.
          git add -A -- docs diagrams case-study agent-infra BLOG.md RoadMap.md STRUCTURE.md project_watchlist.json learning/upstream
          # A newer SHA with identical content is not a reason to open a PR.
          if git diff --cached --quiet -- . ':!learning/upstream/sync-state.json'; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No managed content changes; no PR created.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Create review-only PR (never force push or auto merge)
        if: steps.sync.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.upstream.outputs.branch }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git -c core.hooksPath=/dev/null commit -m "docs: sync upstream content ${UPSTREAM_SHA:0:12}"
          gh auth setup-git
          # Refuse an existing branch: never use --force or --force-with-lease.
          if [ -n "$(git ls-remote --heads origin "$BRANCH")" ]; then
            echo '::error::Branch appeared concurrently; refusing to push.'
            exit 1
          fi
          git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$BRANCH"
          if ! gh pr create --base main --head "$BRANCH" --title "docs: sync pacoxu/AI-Infra ${UPSTREAM_SHA:0:12}" --body-file "$RUNNER_TEMP/sync-summary.md"; then
            echo '::error::PR creation failed. Repository policy may block GITHUB_TOKEN PR creation. The branch was pushed; no PR success is claimed. Review Actions permissions and the branch manually.'
            exit 1
          fi
