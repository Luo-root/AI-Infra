<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16324a">
  <title>AI Infra · 学习阅读器</title>
</head>
<body>
  <header class="topbar">
    <button id="menu-toggle" class="mobile-only" aria-label="打开文档导航" aria-expanded="false" aria-controls="sidebar">☰</button>
    <a class="brand" href="#">AI Infra <span>学习阅读器</span></a>
    <a id="repository-link" class="repository-link" href="https://github.com/Luo-root/AI-Infra" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 查看 AI-Infra 源码或 Star（新窗口打开）">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true" focusable="false"><path d="M12 .75a11.25 11.25 0 0 0-3.558 21.924c.563.103.768-.244.768-.542 0-.267-.01-.975-.015-1.914-3.13.68-3.791-1.509-3.791-1.509-.512-1.3-1.25-1.646-1.25-1.646-1.022-.699.078-.685.078-.685 1.13.08 1.725 1.16 1.725 1.16 1.004 1.72 2.633 1.223 3.274.935.102-.727.393-1.223.715-1.504-2.499-.284-5.126-1.25-5.126-5.563 0-1.229.44-2.233 1.16-3.02-.116-.285-.503-1.43.11-2.98 0 0 .945-.303 3.094 1.154A10.79 10.79 0 0 1 12 6.19c.956.005 1.919.129 2.819.379 2.148-1.457 3.091-1.154 3.091-1.154.615 1.55.228 2.695.112 2.98.722.787 1.158 1.791 1.158 3.02 0 4.324-2.631 5.276-5.138 5.555.404.35.764 1.042.764 2.1 0 1.516-.014 2.739-.014 3.111 0 .301.203.65.774.54A11.252 11.252 0 0 0 12 .75Z"/></svg>
      <span>源码 / Star</span>
    </a>
    <button id="theme-toggle" aria-label="切换深色主题">深色</button>
  </header>
  <div id="nav-backdrop" hidden></div>
  <div class="workspace">
    <aside id="sidebar" aria-label="文档导航">
      <div class="nav-heading"><h2>学习书架</h2><button id="menu-close" class="mobile-only" aria-label="关闭文档导航">✕</button></div>
      <label for="search">全文检索</label>
      <input id="search" type="search" placeholder="搜索标题、正文、术语…" autocomplete="off">
      <label for="category">章节分类</label>
      <select id="category"><option value="">全部章节</option></select>
      <p id="library-stats" class="muted"></p>
      <p id="search-count" role="status" class="muted"></p>
      <nav id="document-list" aria-label="全部文档"></nav>
    </aside>
    <main id="main" tabindex="-1">
      <section id="dashboard" aria-label="学习桌面">
        <p class="eyebrow">一步一步，读懂 AI 基础设施</p>
        <h1>今天从哪里开始？</h1>
        <p class="muted">按学习路线阅读，或从左侧书架查找你关心的主题。阅读进度保存在本机浏览器。</p>
        <a id="continue-reading" class="primary-link" hidden>继续阅读</a>
        <h2>学习路线</h2><ol id="learning-route"></ol>
        <details><summary>上游更新与待关注事项</summary><ul id="updates"></ul></details>
        <p id="baseline" class="muted"></p>
      </section>
      <section id="reader" hidden aria-label="正文阅读">
        <div class="reader-toolbar"><a href="#">← 学习桌面</a><button id="language-toggle" hidden>查看英文原文</button></div>
        <div id="document-meta" class="document-meta"></div>
        <p id="translation-warning" class="translation-warning" role="note" hidden></p>
        <article id="article"></article>
        <p id="selection-help" class="muted">带点线的词可点击或用 Tab 聚焦后按回车查阅；也可以选中正文中的单词，再点“查所选词”。</p>
        <button id="lookup-selection">查所选词</button>
        <nav id="route-navigation" aria-label="路线前后篇"></nav>
      </section>
      <p id="app-status" role="status">正在加载学习资料…</p>
    </main>
    <aside id="toc-panel" aria-label="本章目录"><h2>本章目录</h2><nav id="toc"></nav></aside>
  </div>
  <footer class="site-footer muted">内容来源：<a id="upstream-link" href="https://github.com/pacoxu/AI-Infra" target="_blank" rel="noopener noreferrer">pacoxu/AI-Infra</a> · 本站为学习衍生版，非官方中文版 · <a id="license-link" href="./LICENSE.txt" target="_blank" rel="noopener noreferrer">Apache-2.0 许可证</a></footer>
  <section id="term-card" role="dialog" aria-modal="false" aria-labelledby="term-title" hidden>
    <div class="card-heading"><h2 id="term-title"></h2><button id="term-close" aria-label="关闭词卡">✕</button></div>
    <div id="term-content"></div>
    <button id="speak-term">朗读英语</button><p id="speech-status" role="status" class="muted"></p>
  </section>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
